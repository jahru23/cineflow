name: Build CineFlow APK

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "build-cineflow"
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleStableRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/stable/release -name "*.apk" -exec cp {} build-output/ \;
          find build-output -name "*arm64*" -exec cp {} build-output/CineFlow-arm64.apk \;
          find build-output -name "*universal*" -exec cp {} build-output/CineFlow-universal.apk \;
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineFlow-APKs
          path: build-output/*.apk
          retention-days: 7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-b${{ github.run_number }}"
          gh release create "$TAG_NAME" build-output/*.apk \
            --title "CineFlow v1.0.0 (Build ${{ github.run_number }})" \
            --notes "CineFlow Android APK." \
            --latest
