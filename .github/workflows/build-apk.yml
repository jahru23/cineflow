name: Build CineFlow APK

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "build-cineflow"
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set build version
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          sed -i "s/^versionCode = .*/versionCode = \"$VERSION_CODE\"/" gradle/libs.versions.toml
          sed -i "s/^versionName = .*/versionName = \"$VERSION_NAME\"/" gradle/libs.versions.toml
          grep -E '^(versionCode|versionName)' gradle/libs.versions.toml
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Setup Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > cineflow-release.jks
            echo "Release keystore decoded successfully."
          else
            echo "Warning: RELEASE_KEYSTORE_BASE64 not set, falling back to debug key."
          fi

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleStableRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          ARM64=$(find app/build/outputs/apk/stable/release -name "*arm64*.apk" | head -n1)
          UNIVERSAL=$(find app/build/outputs/apk/stable/release -name "*universal*.apk" | head -n1)
          cp "$ARM64" "build-output/CineFlow-$VERSION_NAME-arm64.apk"
          cp "$UNIVERSAL" "build-output/CineFlow-$VERSION_NAME-universal.apk"
          cp "build-output/CineFlow-$VERSION_NAME-arm64.apk" build-output/CineFlow-arm64.apk
          cp "build-output/CineFlow-$VERSION_NAME-universal.apk" build-output/CineFlow-universal.apk
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: CineFlow-APKs
          path: build-output/*.apk
          retention-days: 7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$VERSION_NAME"
          gh release create "$TAG_NAME" build-output/*.apk \
            --title "CineFlow v$VERSION_NAME" \
            --generate-notes \
            --latest

